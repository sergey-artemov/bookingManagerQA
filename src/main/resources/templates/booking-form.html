<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${booking.id != null} ? 'Редактирование брони' : 'Новая бронь'">Бронь</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <img th:src="@{/img/logo.jpg}" alt="Логотип отеля">
    <h1>Отель «Весёлый Тестировщик»</h1>
</header>

<div class="form-card">
    <h1 th:text="${booking.id != null} ? 'Редактирование брони' : 'Новая бронь'">Бронь</h1>

    <form method="post"
          th:action="${booking.id != null} ? @{/bookings/{id}/edit(id=${booking.id})} : @{/bookings}"
          th:object="${booking}">

        <div class="errors" th:if="${#fields.hasAnyErrors()}">
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Ошибка</li>
            </ul>
        </div>

        <label for="roomNumber">Номер (101–150, 201–250, 301–350, 401–450, 501–550)</label>
        <input type="number" id="roomNumber" th:field="*{roomNumber}">

        <label for="guestName">Гость (до 100 символов)</label>
        <input type="text" id="guestName" th:field="*{guestName}" maxlength="100">

        <label for="bookedFrom">Дата заезда</label>
        <input type="date" id="bookedFrom" th:field="*{bookedFrom}">

        <label for="bookedTo">Дата выезда</label>
        <input type="date" id="bookedTo" th:field="*{bookedTo}">

        <label for="comment">Комментарий (до 200 символов)</label>
        <textarea id="comment" th:field="*{comment}" maxlength="200"></textarea>

        <div class="actions">
            <button type="submit" class="btn">Сохранить</button>
            <a th:href="@{/bookings}" class="btn">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
